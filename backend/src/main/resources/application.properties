server.port=${PORT:8080}

# Supabase PostgreSQL database
# In IntelliJ, set these environment variables before running:
# SUPABASE_DB_URL=jdbc:postgresql://<host>:5432/postgres?sslmode=require
# SUPABASE_DB_USERNAME=postgres
# SUPABASE_DB_PASSWORD=<your Supabase database password>
spring.datasource.url=${SUPABASE_DB_URL:}
spring.datasource.username=${SUPABASE_DB_USERNAME:}
spring.datasource.password=${SUPABASE_DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Hikari connection pool configuration (recommended for Supabase & cloud poolers)
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=900000

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=12MB
app.upload-dir=${APP_UPLOAD_DIR:uploads}

# Email OTP - set these as environment variables before starting Spring Boot.
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
app.otp.expiry-minutes=5

# Initial administrator. The admin is created when the configured username does not exist.
# Never put real credentials in source control.
app.bootstrap-admin.username=${BOOTSTRAP_ADMIN_USERNAME:}
app.bootstrap-admin.password=${BOOTSTRAP_ADMIN_PASSWORD:}
app.bootstrap-admin.name=${BOOTSTRAP_ADMIN_NAME:}
app.bootstrap-admin.email=${BOOTSTRAP_ADMIN_EMAIL:}
